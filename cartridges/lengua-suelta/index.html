<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="/tailwind.css">
<title>Lengua Suelta</title>
<style>
  :root {
    --accent: #2a9d8f;
    --accent-dark: #1d6f66;
    --warn: #e76f51;
    --cream: #f5efe6;
    --gold: #f0d9a8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, #3d2e22 0%, transparent 60%),
      linear-gradient(180deg, #1a1410 0%, #2a1f18 100%);
    color: var(--cream);
    overflow: hidden;
    user-select: none;
    touch-action: none;
  }
  .hidden { display: none !important; }
  #app {
    display: flex; flex-direction: column;
    height: 100dvh; max-width: 720px; margin: 0 auto;
    padding: .45rem .6rem max(.5rem, env(safe-area-inset-bottom));
    gap: .35rem;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0; gap: .4rem;
  }
  .brand h1 {
    margin: 0; font-size: clamp(1.05rem, 3.8vw, 1.4rem); font-weight: 900;
    letter-spacing: .03em; color: var(--gold);
    text-shadow: 0 2px 0 #5c4030;
  }
  .brand p {
    margin: 0; font-size: .55rem; letter-spacing: .14em; text-transform: uppercase;
    color: #9a7b5a; font-weight: 700;
  }
  #salonTag {
    letter-spacing: .16em;
    color: #7dd3c5 !important;
    margin-top: .05rem !important;
  }
  #lessonTopic {
    margin-top: .12rem !important;
    opacity: .85;
    text-transform: none !important;
    letter-spacing: .02em !important;
    font-size: .58rem !important;
  }
  .hud { display: flex; gap: .3rem; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    padding: .2rem .5rem; border-radius: 999px; font-size: .65rem; font-weight: 800;
    background: rgba(0,0,0,.4); border: 1px solid rgba(240,217,168,.25);
  }
  .chip.level { color: var(--gold); }
  .chip.score { color: #7dd3c5; border-color: rgba(42,157,143,.45); }
  .chip.time {
    color: #fda4af; border-color: rgba(231,111,81,.45);
    min-width: 3.6rem; text-align: center; font-variant-numeric: tabular-nums;
  }
  .chip.time.urgent { animation: pulseTime .55s ease infinite; background: rgba(231,111,81,.25); }
  @keyframes pulseTime { 50% { transform: scale(1.06); } }

  #timer-bar {
    flex-shrink: 0; height: .4rem; border-radius: 99px;
    background: rgba(0,0,0,.45); overflow: hidden;
    border: 1px solid rgba(240,217,168,.15);
  }
  #timer-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #e76f51, #e9c46a, #2a9d8f);
    transform-origin: left center;
    transition: transform .1s linear;
  }
  #timer-fill.low { background: linear-gradient(90deg, #9b2226, #e76f51); }

  #salon {
    flex: 1 1 auto; min-height: 0; position: relative;
    border-radius: 1rem; border: 3px solid #5c4030;
    background:
      linear-gradient(180deg, #8b6b4a 0%, #6b4e35 16%, #c4a574 16%, #b8956a 70%, #3d342c 70%, #2a2420 100%);
    box-shadow: inset 0 0 40px rgba(0,0,0,.25), 0 12px 28px rgba(0,0,0,.45);
    overflow: hidden;
  }
  #mainCanvas {
    display: block; width: 100%; height: 100%;
    cursor: crosshair; touch-action: none;
  }

  .tools {
    display: flex; gap: .3rem; justify-content: center; flex-shrink: 0;
  }
  .tool {
    flex: 1; max-width: 11rem;
    padding: .38rem .5rem; border-radius: .55rem; font-size: .7rem; font-weight: 800;
    border: 2px solid transparent; cursor: pointer; font-family: inherit;
    background: rgba(0,0,0,.4); color: var(--cream);
  }
  .tool.active {
    border-color: var(--accent);
    background: rgba(42,157,143,.25);
    color: #7dd3c5;
  }

  #bottom {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: .45rem; align-items: stretch;
  }
  #preview-box {
    background: rgba(0,0,0,.45);
    border: 2px solid rgba(240,217,168,.35);
    border-radius: .75rem;
    padding: .3rem;
    display: flex; flex-direction: column; align-items: center; gap: .15rem;
  }
  #preview-box label {
    font-size: .52rem; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: #9a7b5a;
  }
  #previewCanvas {
    width: 84px; height: 84px; border-radius: .4rem;
    background: #8b6b4a; border: 1px solid #5c4030;
  }
  #side-panel {
    display: flex; flex-direction: column; gap: .35rem; min-width: 0;
  }
  #progress-row {
    display: flex; align-items: center; gap: .45rem;
    font-size: .65rem; font-weight: 700; color: #cbb89a;
  }
  #cut-bar {
    flex: 1; height: .4rem; border-radius: 99px;
    background: rgba(0,0,0,.4); overflow: hidden;
    border: 1px solid rgba(240,217,168,.2);
  }
  #cut-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #2a9d8f, #7dd3c5);
    transition: width .12s ease;
  }
  #chat-strip {
    flex: 1;
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(240,217,168,.2);
    border-radius: .7rem;
    padding: .35rem .6rem;
    font-size: .74rem; line-height: 1.3; color: #cbb89a;
    min-height: 0;
  }
  #chat-strip strong { color: var(--gold); }

  .overlay {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    background: rgba(12,8,6,.88); backdrop-filter: blur(8px);
    padding: 1rem;
  }
  .card {
    width: min(100%, 22rem);
    background:
      radial-gradient(ellipse at 40% 0%, rgba(42,157,143,.18), transparent 55%),
      linear-gradient(165deg, #3a2a1e, #1a1410);
    border: 2px solid rgba(240,217,168,.35);
    border-radius: 1.1rem;
    padding: 1.35rem 1.2rem;
    text-align: center;
    box-shadow: 0 24px 48px rgba(0,0,0,.55);
  }
  .card .hero { font-size: 2.6rem; margin-bottom: .15rem; }
  .card h2 { margin: 0 0 .35rem; font-size: 1.55rem; color: var(--gold); }
  .card p { margin: 0 0 .9rem; color: #cbb89a; font-size: .84rem; line-height: 1.45; }
  .btn {
    border: none; border-radius: .6rem; font-weight: 800; font-family: inherit;
    cursor: pointer; padding: .7rem 1rem; font-size: .9rem; width: 100%;
  }
  .btn-primary {
    background: linear-gradient(160deg, #3cb8a8, var(--accent));
    color: #062820; box-shadow: 0 4px 0 var(--accent-dark);
  }
  .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-dark); }
  .btn-ghost {
    background: transparent; border: 1px solid rgba(240,217,168,.35);
    color: var(--cream); margin-top: .4rem;
  }
  .pct {
    font-size: 2.2rem; font-weight: 900; color: #7dd3c5;
    margin: .15rem 0 .1rem;
  }
  .pct.meh { color: #e9c46a; }
  .pct.bad { color: var(--warn); }

  /* Quiz interrupt */
  #quizOverlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: flex-end; justify-content: center;
    background: rgba(10,6,4,.72);
    padding: .75rem;
  }
  #quizCard {
    width: 100%; max-width: 26rem;
    background: linear-gradient(165deg, #2f241a, #1a1410);
    border: 2px solid rgba(231,111,81,.55);
    border-radius: 1rem;
    padding: .85rem .9rem 1rem;
    box-shadow: 0 16px 40px rgba(0,0,0,.5);
    animation: quizIn .28s ease;
  }
  @keyframes quizIn {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  #quizCard .badge {
    font-size: .55rem; font-weight: 900; letter-spacing: .14em; text-transform: uppercase;
    color: #fda4af; margin-bottom: .35rem;
  }
  #quizQ {
    font-size: clamp(.85rem, 2.8vw, 1rem); font-weight: 800;
    color: var(--cream); line-height: 1.3; margin-bottom: .65rem;
    text-align: left;
  }
  #quizOpts {
    display: flex; flex-direction: column; gap: .35rem;
  }
  .qopt {
    text-align: left; border: 1px solid rgba(240,217,168,.28);
    background: rgba(0,0,0,.35); color: var(--cream);
    border-radius: .55rem; padding: .55rem .7rem;
    font-weight: 700; font-size: .82rem; font-family: inherit; cursor: pointer;
  }
  .qopt:active { background: rgba(42,157,143,.3); border-color: var(--accent); }
  .qopt.ok { border-color: #2a9d8f; background: rgba(42,157,143,.35); }
  .qopt.bad { border-color: var(--warn); background: rgba(231,111,81,.3); }
</style>
</head>
<body>
<div id="app" class="hidden">
  <header>
    <div class="brand">
      <h1 id="brandTitle">Lengua Suelta</h1>
      <p id="salonTag">Hair salon</p>
      <p id="lessonTopic">…</p>
    </div>
    <div class="hud">
      <span class="chip level" id="levelChip">Lv. 1</span>
      <span class="chip score" id="scoreChip">★ 0</span>
      <span class="chip time" id="timeChip">0:45</span>
    </div>
  </header>

  <div id="timer-bar"><div id="timer-fill"></div></div>

  <div class="tools">
    <button type="button" class="tool active" data-tool="cut" id="toolCut">✂ Scissors</button>
    <button type="button" class="tool" data-tool="grow" id="toolGrow">💇 Hair extensions</button>
  </div>

  <div id="salon">
    <canvas id="mainCanvas"></canvas>
    <div id="quizOverlay" class="hidden">
      <div id="quizCard">
        <div class="badge" id="quizBadge">Client asks!</div>
        <div id="quizQ">…</div>
        <div id="quizOpts"></div>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div id="preview-box">
      <label id="previewLabel">Order</label>
      <canvas id="previewCanvas" width="84" height="84"></canvas>
    </div>
    <div id="side-panel">
      <div id="progress-row">
        <span id="cutLabel">Match</span>
        <div id="cut-bar"><div id="cut-fill"></div></div>
        <span id="cutPct">0%</span>
      </div>
      <div id="chat-strip"><strong id="clientName">Client</strong> — <span id="chatText">…</span></div>
    </div>
  </div>
</div>

<div id="startScreen" class="overlay">
  <div class="card">
    <div class="hero">💇</div>
    <h2 id="startTitle">Lengua Suelta</h2>
    <p id="startDesc">…</p>
    <button type="button" class="btn btn-primary" id="btnStart">Open the shop</button>
  </div>
</div>

<div id="levelScreen" class="overlay hidden">
  <div class="card">
    <div class="hero" id="levelHero">✨</div>
    <h2 id="levelTitle">Client done!</h2>
    <div class="pct" id="levelPct">90%</div>
    <p id="levelMsg">…</p>
    <button type="button" class="btn btn-primary" id="btnNextLevel">Next client</button>
  </div>
</div>

<div id="endScreen" class="overlay hidden">
  <div class="card">
    <div class="hero" id="endHero">🏆</div>
    <h2 id="endTitle">…</h2>
    <div class="pct" id="endPct">0</div>
    <p id="endMsg">…</p>
    <button type="button" class="btn btn-primary" id="btnNextLesson">Next lesson</button>
    <button type="button" class="btn btn-ghost" id="btnRetry">Retry shift</button>
  </div>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
