# Regenerate Arcade catalog from cartridges/ and fail if manifest.json drifts.
# Runs on every push/PR to main (and on demand).
name: Games Catalog

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "cartridges/**"
      - "game_builder.py"
      - "manifest.json"
      - ".github/workflows/games-catalog.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "cartridges/**"
      - "game_builder.py"
      - "manifest.json"
      - ".github/workflows/games-catalog.yml"

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate manifest.json
        run: python game_builder.py

      - name: Fail if catalog is out of sync
        run: |
          if ! git diff --exit-code -- manifest.json; then
            echo "::error::manifest.json is stale. Run: python game_builder.py"
            echo "::error::Commit the regenerated manifest.json (or fix meta.json / cartridges)."
            exit 1
          fi
          echo "manifest.json matches cartridges/ + meta.json"

      - name: Validate catalog entries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          if not isinstance(data, list) or not data:
              raise SystemExit("manifest.json must be a non-empty array")

          seen = set()
          for i, g in enumerate(data):
              if not isinstance(g, dict):
                  raise SystemExit(f"entry {i}: not an object")
              gid = str(g.get("id") or "").strip()
              name = str(g.get("name") or "").strip()
              path = str(g.get("path") or "").strip()
              desc = str(g.get("description") or "").strip()
              if not gid or not name or not path or not desc:
                  raise SystemExit(f"entry {i} ({gid!r}): need id, name, path, description")
              if gid in seen:
                  raise SystemExit(f"duplicate id: {gid}")
              seen.add(gid)
              rel = path[2:] if path.startswith("./") else path
              if not Path(rel).is_file():
                  raise SystemExit(f"{gid}: path missing on disk: {path}")
              descriptions = g.get("descriptions")
              if descriptions is not None:
                  if not isinstance(descriptions, dict) or not descriptions:
                      raise SystemExit(f"{gid}: descriptions must be a non-empty object when present")
                  for k, v in descriptions.items():
                      if not str(k).strip() or not str(v).strip():
                          raise SystemExit(f"{gid}: empty descriptions key/value")

          print(f"ok: {len(data)} games")
          PY
